[build-system]
requires = ["setuptools>=62.3", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "susan"
version = "0.5"
description = "SUSAN framework for CryoET subtomogram averaging"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.6.0",
]

[project.optional-dependencies]
ml       = ["torch"]
analysis = ["scikit-image", "scikit-learn", "numba", "bm4d"]
full     = ["susan[ml]", "susan[analysis]"]

[[project.authors]]
name = "Ricardo Miguel Sánchez Loayza"
email = "ricardo.sanchez@embl.de"

[project.urls]
Homepage = "https://github.com/rsanchezloayza/SUSAN"

[tool.setuptools.package-data]
# Only the CUDA executables travel as data. The Cython cores are real
# ext_modules, so setuptools places them and tags the wheel for the right ABI.
susan = ["bin/susan*"]
