# SUSAN install overlay. Requires cmake, gcc/g++, and the CUDA toolkit on PATH.
# Apply to an existing activated environment:
#   conda env update --file envs/environment_susan.yml
channels:
  - conda-forge
  - nodefaults
dependencies:
  - numpy>=1.20
  - scipy>=1.6
  - pip
  - pip:
    - "git+https://github.com/rsanchezloayza/SUSAN"
